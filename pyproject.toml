[project]
name = "labfigs"
version = "0.1.0"
description = "House style and helpers for lab figures"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "seaborn>=0.13", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["labfigs"]
